[book]
title = "오픈소스 서버·서비스 안전운영 실습 — 심화 핸드북"
authors = ["KREONET 과학데이터교육센터"]
language = "ko"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
