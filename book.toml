[book]
title = "오픈소스 안전운영 실습 — 서버와 서비스를 맡게 된 사람을 위한 손으로 익히는 보안"
authors = ["KREONET 과학데이터교육센터"]
language = "ko"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/KREONET/osso-book"
edit-url-template = "https://github.com/KREONET/osso-book/edit/main/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
